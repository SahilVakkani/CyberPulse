name: Update news data

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: python collector/collector.py --config collector/feeds.yml --out docs/data/news.json

      - name: Commit updated data
        run: |
          git config user.name "cyberpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/news.json
          git diff --staged --quiet || (git commit -m "Update news data" && git push)
