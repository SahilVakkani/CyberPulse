# CyberPulse sources. Add or remove entries freely.
# type: news | vendor-research | government | community
# tags: optional default topics for every item from that feed
#   (topics: malware, ransomware, threat-hunting, vulnerabilities,
#    cloud-identity, dfir, threat-actors, phishing)
# Feed URLs change over time. The collector logs failures per feed and keeps going.

feeds:
  # --- News ---
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    type: news
  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    type: news
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    type: news
  - name: SecurityWeek
    url: https://feeds.feedburner.com/securityweek
    type: news
  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    type: news
  - name: The Record
    url: https://therecord.media/feed
    type: news
  - name: Schneier on Security
    url: https://www.schneier.com/feed/atom/
    type: news

  # --- Vendor and research blogs ---
  - name: Microsoft Security Blog
    url: https://www.microsoft.com/en-us/security/blog/feed/
    type: vendor-research
  - name: Microsoft Security Response Center
    url: https://msrc.microsoft.com/blog/feed
    type: vendor-research
    tags: [vulnerabilities]
  - name: Google Threat Intelligence (Mandiant)
    url: https://cloud.google.com/blog/topics/threat-intelligence/rss/
    type: vendor-research
    tags: [threat-actors]
  - name: Google Project Zero
    url: https://googleprojectzero.blogspot.com/feeds/posts/default
    type: vendor-research
    tags: [vulnerabilities]
  - name: CrowdStrike Blog
    url: https://www.crowdstrike.com/en-us/blog/feed
    type: vendor-research
  - name: Unit 42 (Palo Alto Networks)
    url: https://unit42.paloaltonetworks.com/feed/
    type: vendor-research
